version: '3.8'
services:
  postgres:
    image: postgres:15
    container_name: seandev_postgres
    environment:
      POSTGRES_USER: arena
      POSTGRES_PASSWORD: arena_local
      POSTGRES_DB: arena_seandev
    ports:
      - "5433:5432"
    volumes:
      - seandev_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: seandev_redis
    ports:
      - "6380:6379"

volumes:
  seandev_pgdata:
