name: Deploy to Dev

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
        run: |
          if [ -z "$EC2_SSH_KEY" ] || [ -z "$EC2_HOST" ] || [ -z "$EC2_USERNAME" ]; then
            echo "Error: One or more required secrets are not set"
            exit 1
          fi

          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          ssh -v -i ~/.ssh/id_rsa "$EC2_USERNAME@$EC2_HOST" "cd /home/ubuntu/arena-app/app-v1 && git pull && npm install && pm2 restart arena-ai"

          rm -f ~/.ssh/id_rsa
