name: Deploy — seandev

on:
  push:
    branches: [main]

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-ec2-env.yml
    with:
      app_path: /home/ubuntu/arena-app/seandev
      api_pm2_name: seandev-api
      frontend_pm2_name: seandev-frontend
    secrets:
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
