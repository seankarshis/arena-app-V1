name: CD — Deploy to Fargate

on:
  workflow_run:
    workflows: ["CI — Test & Build"]
    types: [completed]
    branches: [main]

env:
  AWS_REGION: us-east-1
  ECR_REPO_API: arena-api
  ECR_REPO_FRONTEND: arena-frontend
  ECS_CLUSTER: arena-cluster

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ── Gate: only deploy when CI passed ───────────────────────────
  gate:
    name: Verify CI Success
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - run: echo "CI passed on ${{ github.event.workflow_run.head_sha }} — proceeding with deploy"

  # ── Run Prisma Migrations ──────────────────────────────────────
  migrate:
    name: Run Prisma Migrations
    runs-on: ubuntu-latest
    needs: [gate]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install API dependencies
        working-directory: api
        run: npm ci

      - name: Generate Prisma client
        working-directory: api
        run: npx prisma generate

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Retrieve database URL from Secrets Manager
        id: db-url
        run: |
          DB_URL=$(aws secretsmanager get-secret-value \
            --secret-id arena/database-url \
            --query SecretString \
            --output text)
          echo "::add-mask::$DB_URL"
          echo "DATABASE_URL=$DB_URL" >> "$GITHUB_ENV"

      - name: Run Prisma migrate deploy
        working-directory: api
        run: npx prisma migrate deploy

  # ── Deploy API Service ─────────────────────────────────────────
  deploy-api:
    name: Deploy API Service
    runs-on: ubuntu-latest
    needs: [migrate]
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Verify API image exists in ECR
        run: |
          aws ecr describe-images \
            --repository-name ${{ env.ECR_REPO_API }} \
            --image-ids imageTag=${{ github.event.workflow_run.head_sha }} \
            --query 'imageDetails[0].imageTags' \
            --output text

      - name: Discover API service name
        id: svc
        run: |
          SVC=$(aws ecs list-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --query "serviceArns[?contains(@, 'ApiService')]" \
            --output text | xargs -n1 basename)
          if [ -z "$SVC" ]; then
            echo "ERROR: Could not find API service in cluster ${{ env.ECS_CLUSTER }}"
            exit 1
          fi
          echo "name=$SVC" >> "$GITHUB_OUTPUT"
          echo "Discovered API service: $SVC"

      - name: Force new deployment of API service
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ steps.svc.outputs.name }} \
            --force-new-deployment \
            --query 'service.serviceName' \
            --output text

      - name: Wait for API service stability
        run: |
          echo "Waiting for API service to stabilize..."
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ steps.svc.outputs.name }}
          echo "API service is stable."

  # ── Deploy Frontend Service ────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend Service
    runs-on: ubuntu-latest
    needs: [gate]
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Verify Frontend image exists in ECR
        run: |
          aws ecr describe-images \
            --repository-name ${{ env.ECR_REPO_FRONTEND }} \
            --image-ids imageTag=${{ github.event.workflow_run.head_sha }} \
            --query 'imageDetails[0].imageTags' \
            --output text

      - name: Discover Frontend service name
        id: svc
        run: |
          SVC=$(aws ecs list-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --query "serviceArns[?contains(@, 'FrontendService')]" \
            --output text | xargs -n1 basename)
          if [ -z "$SVC" ]; then
            echo "ERROR: Could not find Frontend service in cluster ${{ env.ECS_CLUSTER }}"
            exit 1
          fi
          echo "name=$SVC" >> "$GITHUB_OUTPUT"
          echo "Discovered Frontend service: $SVC"

      - name: Force new deployment of Frontend service
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ steps.svc.outputs.name }} \
            --force-new-deployment \
            --query 'service.serviceName' \
            --output text

      - name: Wait for Frontend service stability
        run: |
          echo "Waiting for Frontend service to stabilize..."
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ steps.svc.outputs.name }}
          echo "Frontend service is stable."

  # ── Post-Deploy Smoke Test ─────────────────────────────────────
  smoke-test:
    name: Post-Deploy Smoke Test
    runs-on: ubuntu-latest
    needs: [deploy-api, deploy-frontend]
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get ALB DNS name
        id: alb
        run: |
          ALB_DNS=$(aws cloudformation describe-stacks \
            --stack-name ComputeStack \
            --query "Stacks[0].Outputs[?OutputKey=='AlbDnsName'].OutputValue" \
            --output text)
          echo "alb_dns=$ALB_DNS" >> "$GITHUB_OUTPUT"

      - name: Check API health
        run: |
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              "http://${{ steps.alb.outputs.alb_dns }}/health" || true)
            if [ "$STATUS" = "200" ]; then
              echo "API health check passed"
              exit 0
            fi
            echo "Attempt $i: got $STATUS, retrying in 10s..."
            sleep 10
          done
          echo "API health check failed after 5 attempts"
          exit 1

      - name: Check Frontend health
        run: |
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              "http://${{ steps.alb.outputs.alb_dns }}/" || true)
            if [ "$STATUS" = "200" ]; then
              echo "Frontend health check passed"
              exit 0
            fi
            echo "Attempt $i: got $STATUS, retrying in 10s..."
            sleep 10
          done
          echo "Frontend health check failed after 5 attempts"
          exit 1
