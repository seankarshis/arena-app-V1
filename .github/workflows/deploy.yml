name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'frontend/**'
      - 'infrastructure/lambdas/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'

# Never cancel an active deploy — partial deployments are worse than letting
# the queued run wait. A new push to main will simply queue behind the current deploy.
concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  AWS_REGION: us-east-1
  ECR_REPO_API: arena-api
  ECR_REPO_FRONTEND: arena-frontend
  ECS_CLUSTER: arena-cluster

permissions:
  id-token: write   # OIDC token for AWS credential federation
  contents: read

# ──────────────────────────────────────────────────────────────────────────────
# SKIP CHECK
# If the push was made by github-actions[bot] (an agent fix commit that landed
# on main via a merge), skip this pipeline entirely.
# ──────────────────────────────────────────────────────────────────────────────
jobs:
  skip-check:
    name: Skip check — bot commit?
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Detect github-actions[bot] commit
        id: check
        run: |
          AUTHOR=$(git log -1 --format='%an')
          echo "Latest commit author: $AUTHOR"
          if [[ "$AUTHOR" == "github-actions[bot]" ]]; then
            echo "Skipping deploy pipeline — commit was made by github-actions[bot]"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

# ──────────────────────────────────────────────────────────────────────────────
# PHASE 1: DETERMINISTIC PRE-CHECKS  (parallel — same checks as PR pipeline)
# All must pass before building and deploying.
# ──────────────────────────────────────────────────────────────────────────────

  dependency-audit:
    name: Dependency Audit
    needs: skip-check
    if: needs.skip-check.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install API dependencies
        working-directory: api
        run: npm ci

      - name: Run npm audit (API)
        working-directory: api
        run: |
          npm audit --json > ../audit-report.json || true
          CRITICAL=$(jq '.metadata.vulnerabilities.critical // 0' ../audit-report.json)
          HIGH=$(jq '.metadata.vulnerabilities.high // 0' ../audit-report.json)
          echo "Critical: $CRITICAL  High: $HIGH"
          if [[ "$CRITICAL" -gt 0 || "$HIGH" -gt 0 ]]; then
            echo "::error::npm audit found $CRITICAL critical and $HIGH high vulnerabilities — blocking deploy"
            exit 1
          fi

  bundle-size:
    name: Bundle Size Check
    needs: skip-check
    if: needs.skip-check.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_API_URL: 'http://localhost:3001/graphql'

      - name: Check bundle size
        working-directory: frontend
        run: |
          python3 << 'PYEOF'
          import pathlib, sys

          build_dir = pathlib.Path('.next')
          if not build_dir.exists():
              print('ERROR: .next directory not found', file=sys.stderr)
              sys.exit(1)

          total = sum(p.stat().st_size for p in (build_dir / 'static').rglob('*') if p.is_file())
          limit = 10 * 1024 * 1024
          print(f'Bundle size: {total / 1024 / 1024:.2f} MB (limit {limit / 1024 / 1024:.0f} MB)')
          if total > limit:
              print(f'::error::Bundle exceeds size limit — blocking deploy')
              sys.exit(1)
          PYEOF

  bearer-scan:
    name: Bearer SAST Scan
    needs: skip-check
    if: needs.skip-check.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Run Bearer SAST scan
        uses: bearer/bearer-action@v2
        with:
          format: json
          output: bearer-report.json
          severity: critical,high

  blast-radius:
    name: Blast Radius Analysis
    needs: skip-check
    if: needs.skip-check.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm install

      - name: Get changed TypeScript files vs previous commit
        id: changed-files
        run: |
          # On a push to main, compare HEAD against its parent
          CHANGED=$(git diff --name-only HEAD~1...HEAD \
            -- 'api/src/' 'frontend/src/' 'infrastructure/lambdas/' \
            | grep -E '\.(ts|tsx)$' | tr '\n' ',' | sed 's/,$//')
          echo "Changed TS files: $CHANGED"
          echo "files=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Run blast radius analysis
        run: |
          if [[ -z "${{ steps.changed-files.outputs.files }}" ]]; then
            echo "No TypeScript files changed"
            echo '{"changed_files":[],"downstream_dependencies":[],"upstream_dependents":[],"full_scope":[],"stats":{"changed_count":0,"downstream_count":0,"upstream_count":0,"total_scope":0,"total_repo_files":0}}' > blast-radius.json
          else
            npx ts-node .github/scripts/blast-radius.ts \
              --files "${{ steps.changed-files.outputs.files }}"
          fi
          jq '{in_scope: .stats.total_scope, changed: .stats.changed_count}' blast-radius.json

# ──────────────────────────────────────────────────────────────────────────────
# BUILD
# Build and push Docker images to ECR. Reuses the existing CI/CD ECR pattern.
# ──────────────────────────────────────────────────────────────────────────────

  build:
    name: Build & Push Images
    needs: [dependency-audit, bundle-size, bearer-scan, blast-radius]
    if: needs.skip-check.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image-tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPO_API }}:${{ github.sha }}
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPO_API }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPO_FRONTEND }}:${{ github.sha }}
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPO_FRONTEND }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_TELEMETRY_DISABLED=1

# ──────────────────────────────────────────────────────────────────────────────
# DEPLOY — DEV
# Deploy to the dev environment, run Prisma migrations, then smoke test.
# Placeholder steps for ECS deployment — update with actual cluster/service
# names once CDK stacks are deployed (see brain/runbooks/cdk-deploy-checklist.md).
# ──────────────────────────────────────────────────────────────────────────────

  deploy-dev:
    name: Deploy to Dev
    needs: [build]
    if: needs.skip-check.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: dev
      url: ${{ steps.get-url.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install API dependencies
        working-directory: api
        run: npm ci

      - name: Generate Prisma client
        working-directory: api
        run: npx prisma generate

      # Run migrations against the dev database before starting new containers
      - name: Run Prisma migrations (dev)
        working-directory: api
        run: npx prisma migrate deploy
        env:
          # Retrieve DATABASE_URL from Secrets Manager at runtime
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}

      # PLACEHOLDER: update service name once CDK stacks are deployed
      - name: Deploy API to ECS (dev)
        run: |
          echo "TODO: Replace with actual dev ECS cluster and service names from CDK output"
          echo "Example command:"
          echo "  aws ecs update-service --cluster arena-dev-cluster --service ArenaApiService --force-new-deployment"
          echo "  aws ecs wait services-stable --cluster arena-dev-cluster --services ArenaApiService"
          # Uncomment and update after first CDK deploy:
          # aws ecs update-service \
          #   --cluster arena-dev-cluster \
          #   --service ArenaApiService \
          #   --image-override "containerOverrides=[{name=api,image=$ECR_REGISTRY/$ECR_REPO_API:${{ github.sha }}}]" \
          #   --force-new-deployment
          # aws ecs wait services-stable --cluster arena-dev-cluster --services ArenaApiService

      - name: Deploy Frontend to ECS (dev)
        run: |
          echo "TODO: Replace with actual dev ECS cluster and service names from CDK output"
          # Uncomment and update after first CDK deploy:
          # aws ecs update-service \
          #   --cluster arena-dev-cluster \
          #   --service ArenaFrontendService \
          #   --force-new-deployment
          # aws ecs wait services-stable --cluster arena-dev-cluster --services ArenaFrontendService

      - name: Get dev environment URL
        id: get-url
        run: |
          # TODO: Replace with actual CloudFormation stack output lookup after CDK deploy
          echo "url=http://dev.arena.internal" >> "$GITHUB_OUTPUT"

  smoke-test-dev:
    name: Smoke Test — Dev
    needs: [deploy-dev]
    if: needs.skip-check.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check API health (dev)
        run: |
          # TODO: Replace ALB_URL with the actual dev ALB DNS after CDK deploy
          # ALB_URL=$(aws cloudformation describe-stacks \
          #   --stack-name ArenaComputeStackDev \
          #   --query "Stacks[0].Outputs[?OutputKey=='AlbDnsName'].OutputValue" \
          #   --output text)
          ALB_URL="${{ secrets.DEV_ALB_URL }}"
          echo "Smoke testing dev API at: $ALB_URL"
          for i in 1 2 3 4 5; do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "http://${ALB_URL}/health" || true)
            if [[ "$STATUS" == "200" ]]; then
              echo "Dev API health check passed"
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS — retrying in 15s"
            sleep 15
          done
          echo "::error::Dev API health check failed after 5 attempts"
          exit 1

# ──────────────────────────────────────────────────────────────────────────────
# DEPLOY — PROD
# Only runs after dev smoke tests pass. Same placeholder structure as dev.
# ──────────────────────────────────────────────────────────────────────────────

  deploy-prod:
    name: Deploy to Prod
    needs: [smoke-test-dev]
    if: needs.skip-check.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ steps.get-url.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install API dependencies
        working-directory: api
        run: npm ci

      - name: Generate Prisma client
        working-directory: api
        run: npx prisma generate

      - name: Run Prisma migrations (prod)
        working-directory: api
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}

      # PLACEHOLDER: update after CDK stacks are deployed to prod
      - name: Deploy API to ECS (prod)
        run: |
          echo "TODO: Replace with actual prod ECS cluster and service names from CDK output"
          # aws ecs update-service \
          #   --cluster arena-prod-cluster \
          #   --service ArenaApiService \
          #   --force-new-deployment
          # aws ecs wait services-stable --cluster arena-prod-cluster --services ArenaApiService

      - name: Deploy Frontend to ECS (prod)
        run: |
          echo "TODO: Replace with actual prod ECS cluster and service names from CDK output"
          # aws ecs update-service \
          #   --cluster arena-prod-cluster \
          #   --service ArenaFrontendService \
          #   --force-new-deployment
          # aws ecs wait services-stable --cluster arena-prod-cluster --services ArenaFrontendService

      - name: Get prod environment URL
        id: get-url
        run: |
          echo "url=https://arena.elastichorizon.com" >> "$GITHUB_OUTPUT"

  smoke-test-prod:
    name: Smoke Test — Prod
    needs: [deploy-prod]
    if: needs.skip-check.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check API health (prod)
        run: |
          # TODO: Replace ALB_URL with the actual prod ALB DNS after CDK deploy
          ALB_URL="${{ secrets.PROD_ALB_URL }}"
          echo "Smoke testing prod API at: $ALB_URL"
          for i in 1 2 3 4 5; do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "http://${ALB_URL}/health" || true)
            if [[ "$STATUS" == "200" ]]; then
              echo "Prod API health check passed"
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS — retrying in 15s"
            sleep 15
          done
          echo "::error::Prod API health check failed after 5 attempts"
          exit 1

      - name: Check Frontend health (prod)
        run: |
          ALB_URL="${{ secrets.PROD_ALB_URL }}"
          for i in 1 2 3 4 5; do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "https://arena.elastichorizon.com/" || true)
            if [[ "$STATUS" == "200" ]]; then
              echo "Prod frontend health check passed"
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS — retrying in 15s"
            sleep 15
          done
          echo "::error::Prod frontend health check failed after 5 attempts"
          exit 1

      - name: Notify on deploy outcome
        if: always()
        run: |
          # TODO: Add Slack or email notification here once secrets are configured
          # Example (Slack):
          # curl -s -X POST ${{ secrets.SLACK_DEPLOY_WEBHOOK }} \
          #   -H 'Content-type: application/json' \
          #   --data "{\"text\": \"Deploy to prod ${{ job.status }}: \`${{ github.sha }}\` — ${{ github.event.head_commit.message }}\"}"
          echo "Deploy to prod completed with status: ${{ job.status }}"
          echo "Commit: ${{ github.sha }}"
          echo "Message: ${{ github.event.head_commit.message }}"
